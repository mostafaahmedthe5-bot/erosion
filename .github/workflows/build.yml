name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: "*.ipa"
